dataset_path: arrow
dataset_kwargs:
  data_files:
    - /data1/wenjie/huggingface/datasets/MME_mismatch/data-00000-of-00004.arrow
    - /data1/wenjie/huggingface/datasets/MME_mismatch/data-00001-of-00004.arrow
    - /data1/wenjie/huggingface/datasets/MME_mismatch/data-00002-of-00004.arrow
    - /data1/wenjie/huggingface/datasets/MME_mismatch/data-00003-of-00004.arrow
task: mme_mismatch
test_split: train
process_docs: !function utils.mme_mismatch_process_docs
output_type: generate_until
doc_to_visual: !function utils.mme_mismatch_doc_to_visual
doc_to_text: !function utils.mme_mismatch_doc_to_text
doc_to_target: !function utils.mme_mismatch_doc_to_target
generation_kwargs:
  max_new_tokens: 128
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.mme_mismatch_process_results
metric_list:
  - metric: mme_mismatch_refusal_accuracy
    aggregation: !function utils.mme_mismatch_aggregate_refusal_accuracy
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nIf the image does not match the question, say you cannot answer based on the image. Otherwise, answer briefly:"
metadata:
  - version: 0.0
